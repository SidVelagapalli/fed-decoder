[project]
name = "fed-decoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddarth Velagapalli", email = "SidVelagapalli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
fed-decoder = "fed_decoder:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
